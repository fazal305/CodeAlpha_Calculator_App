<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsive neon image gallery with category filters, search, masonry layout, fullscreen lightbox, and smooth animations built using HTML, CSS, JavaScript, Bootstrap 5, and jQuery."
    />
    <link rel="canonical" href="https://fazal305.github.io/CodeAlpha_ImageGallery/" />
    <title>CodeAlpha Internship Image Gallery | Fazal Abbas</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/CodeAlpha_ImageGallery/" />
    <meta property="og:title" content="CodeAlpha Internship Image Gallery | Fazal Abbas" />
    <meta
      property="og:description"
      content="Responsive neon image gallery with category filters, search, masonry layout, fullscreen lightbox, and smooth animations built using HTML, CSS, JavaScript, Bootstrap 5, and jQuery."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeAlpha Internship Image Gallery | Fazal Abbas" />
    <meta
      name="twitter:description"
      content="Responsive neon image gallery with category filters, search, masonry layout, fullscreen lightbox, and smooth animations built using HTML, CSS, JavaScript, Bootstrap 5, and jQuery."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Lexend:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="gallery-styles.css" />
  </head>
  <body>
    <header class="gallery-header">
      <div class="container">
        <p class="eyebrow-text">CodeAlpha Frontend Internship Project</p>
        <h1>Image Gallery</h1>
        <p class="header-subtitle">
          A responsive visual gallery with category filters, live search,
          masonry layout, and keyboard-friendly lightbox navigation.
        </p>
      </div>
    </header>

    <main class="gallery-main">
      <section class="gallery-controls" aria-label="Gallery filters">
        <div class="container">
          <div
            class="filter-wrapper"
            role="list"
            aria-label="Filter images by category"
          >
            <button
              class="filter-pill active-filter"
              data-category="all"
              type="button"
            >
              All
            </button>
            <button class="filter-pill" data-category="nature" type="button">
              Nature
            </button>
            <button class="filter-pill" data-category="city" type="button">
              City
            </button>
            <button
              class="filter-pill"
              data-category="architecture"
              type="button"
            >
              Architecture
            </button>
            <button class="filter-pill" data-category="abstract" type="button">
              Abstract
            </button>
            <button class="filter-pill" data-category="people" type="button">
              People
            </button>
          </div>

          <div class="search-wrapper">
            <label class="sr-only" for="search-input"
              >Search gallery images</label
            >
            <input
              type="search"
              id="search-input"
              class="gallery-search"
              placeholder="Search by title, category, or credit"
              autocomplete="off"
            />

            <button
              id="masonry-toggle"
              class="masonry-toggle"
              type="button"
              aria-pressed="false"
            >
              Masonry View
            </button>
          </div>
        </div>
      </section>

      <section class="gallery-section" aria-label="Image gallery">
        <div class="container">
          <div id="gallery-grid" class="gallery-grid"></div>
        </div>
      </section>
    </main>

    <div
      id="lightbox-overlay"
      class="lightbox-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Image preview"
      hidden
    >
      <button
        id="lightbox-close"
        class="lightbox-close"
        type="button"
        aria-label="Close lightbox"
      >
        Close
      </button>
      <button
        id="prev-btn"
        class="lightbox-nav lightbox-prev"
        type="button"
        aria-label="Previous image"
      >
        Prev
      </button>

      <div class="lightbox-content">
        <div class="lightbox-image-frame">
          <img id="lightbox-image" src="" alt="" />
        </div>

        <div class="lightbox-details">
          <span id="lightbox-category" class="lightbox-category">Category</span>
          <h2 id="lightbox-title">Image Title</h2>
          <p id="lightbox-credit">Photo credit</p>
          <p id="lightbox-counter">1 / 13</p>

          <button id="fullscreen-btn" class="fullscreen-btn" type="button">
            Fullscreen
          </button>
        </div>
      </div>

      <button
        id="next-btn"
        class="lightbox-nav lightbox-next"
        type="button"
        aria-label="Next image"
      >
        Next
      </button>
    </div>

    <script src="gallery-script.js"></script>
  </body>
</html>

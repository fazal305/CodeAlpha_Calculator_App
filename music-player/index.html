<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Modern music player built with HTML, CSS, and JavaScript featuring vinyl record animation, playlist management, autoplay, shuffle, repeat modes, progress tracking, and volume controls."
    />
    <link rel="canonical" href="https://fazal305.github.io/CodeAlpha_MusicPlayer/" />
    <title>CodeAlpha Internship Music Player | Fazal Abbas</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/CodeAlpha_MusicPlayer/" />
    <meta property="og:title" content="CodeAlpha Internship Music Player | Fazal Abbas" />
    <meta
      property="og:description"
      content="Modern music player built with HTML, CSS, and JavaScript featuring vinyl record animation, playlist management, autoplay, shuffle, repeat modes, progress tracking, and volume controls."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeAlpha Internship Music Player | Fazal Abbas" />
    <meta
      name="twitter:description"
      content="Modern music player built with HTML, CSS, and JavaScript featuring vinyl record animation, playlist management, autoplay, shuffle, repeat modes, progress tracking, and volume controls."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="player-styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="player-layout" aria-label="Music player">
        <article class="player-card">
          <header class="player-header">
            <p class="eyebrow-text">CodeAlpha Internship Project</p>
            <h1>Music Player</h1>
            <p class="header-description">
              A responsive vanilla JavaScript audio player with playlist,
              shuffle, repeat, and saved volume controls.
            </p>
          </header>

          <section class="cover-section" aria-label="Current track artwork">
            <div class="vinyl-disc" id="vinyl-disc">
              <div class="vinyl-ring"></div>

              <div class="vinyl-center">
                <img
                  src="assets/covers/cover-01.jpg"
                  alt="Late Shift Drive cover"
                  class="vinyl-cover"
                  id="vinyl-cover"
                />
                <div class="vinyl-fallback" id="vinyl-fallback">LS</div>
              </div>
            </div>
          </section>

          <section class="song-info" aria-live="polite">
            <div class="title-mask">
              <h2 class="song-title" id="song-title">Late Shift Drive</h2>
            </div>
            <p class="song-artist" id="song-artist">Neon Valley</p>
          </section>

          <section class="progress-section" aria-label="Playback progress">
            <div class="time-row">
              <span id="current-time">0:00</span>
              <span id="total-duration">0:00</span>
            </div>

            <label class="sr-only" for="progress-bar"
              >Seek through current track</label
            >
            <input
              type="range"
              id="progress-bar"
              class="progress-bar"
              min="0"
              max="100"
              value="0"
            />
          </section>

          <section class="controls-section" aria-label="Playback controls">
            <button
              class="control-btn small-control"
              id="shuffle-btn"
              type="button"
              aria-label="Toggle shuffle"
            >
              SH
            </button>
            <button
              class="control-btn medium-control"
              id="prev-btn"
              type="button"
              aria-label="Previous track"
            >
              PREV
            </button>
            <button
              class="control-btn play-control"
              id="play-btn"
              type="button"
              aria-label="Play current track"
            >
              PLAY
            </button>
            <button
              class="control-btn medium-control"
              id="next-btn"
              type="button"
              aria-label="Next track"
            >
              NEXT
            </button>
            <button
              class="control-btn small-control"
              id="repeat-btn"
              type="button"
              aria-label="Change repeat mode"
            >
              RPT
            </button>
          </section>

          <section class="volume-section" aria-label="Volume controls">
            <button
              class="volume-btn"
              id="mute-btn"
              type="button"
              aria-label="Mute audio"
            >
              VOL
            </button>

            <label class="sr-only" for="volume-slider">Volume</label>
            <input
              type="range"
              id="volume-slider"
              class="volume-slider"
              min="0"
              max="100"
              value="80"
            />

            <span class="volume-value" id="volume-value">80%</span>
          </section>

          <button
            class="playlist-toggle"
            id="playlist-toggle"
            type="button"
            aria-controls="playlist-panel"
            aria-expanded="false"
          >
            Show Playlist
          </button>
        </article>

        <aside class="playlist-panel" id="playlist-panel" hidden>
          <div class="playlist-header">
            <div>
              <p class="eyebrow-text">Queue</p>
              <h2>Playlist</h2>
            </div>

            <span class="track-count" id="track-count">5 tracks</span>
          </div>

          <div class="playlist-list" id="playlist-list"></div>
        </aside>
      </section>
    </main>

    <script src="player-script.js"></script>
  </body>
</html>
